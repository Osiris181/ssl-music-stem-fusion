# Retain supplied EmoMusic target columns, native-score labels and shared optimization.
protocol: mid_fusion.yaml
dataset: emomusic
features:
  name: msd_musicnn
  dimension_per_source: 200
  pooling: track_window_mean
  harmony: false
model:
  hidden_dimensions: [512, 256]
  activation: relu
  dropout: 0.0
  output_labels: 1
paths:
  manifest: ../../../data/manifests/emomusic/emomusic_features.jsonl
  feature_dir: ../../../data/features/emomusic/msd_musicnn
  output_dir: ../../../outputs/emomusic/cnn/runs
  summary_dir: ../../../outputs/emomusic/cnn
