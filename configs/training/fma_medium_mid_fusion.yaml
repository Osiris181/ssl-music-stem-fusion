# Retained FMA-Medium MusicFM mid-fusion training settings.
task:
  name: genre_classification
  label_type: multiclass
  number_of_classes: 16

features:
  name: musicfm_msd_layer7
  dimension_per_source: 1024
  fusion: concatenate
  source_order:
    - mixture
    - guitar
    - drums
    - piano
    - bass
    - vocals
    - other
  legacy_drop_all_zero_source_vectors: true

model:
  name: deep_mlp
  hidden_dimensions: [1024, 512]
  activation: relu
  dropout: 0.2

optimization:
  loss: cross_entropy
  optimizer: adam
  learning_rate: 0.0001
  batch_size: 128
  epochs: 20

checkpoint:
  split: validation
  maximize: [accuracy_micro, roc_auc_macro, pr_auc_macro]
  aggregation: sum

evaluation:
  accuracy: micro
  precision: macro
  recall: macro
  f1: macro
  roc_auc: macro_one_vs_rest
  pr_auc: macro_one_vs_rest

reproducibility:
  seed: 42
  cudnn_deterministic: true
  cudnn_benchmark: false

runtime:
  device: auto
  num_workers: 0
