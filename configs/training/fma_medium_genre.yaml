# Shared settings for every FMA-Medium baseline, control, and fusion model.
task:
  name: genre_classification
  label_type: multiclass
  number_of_classes: 16
features:
  name: musicfm_msd_layer7
  dimension_per_source: 1024
  source_order: [mixture, guitar, drums, piano, bass, vocals]
  silent_vector_policy: retain
  normalization: none
model:
  hidden_dimensions: [1024, 512]
  activation: relu
  dropout: 0.2
optimization:
  loss: cross_entropy
  optimizer: adam
  learning_rate: 0.0001
  betas: [0.9, 0.999]
  epsilon: 0.00000001
  weight_decay: 0.0
  scheduler: none
  early_stopping: none
  batch_size: 128
  epochs: 20
checkpoint:
  split: validation
  maximize: [accuracy_micro, roc_auc_macro, pr_auc_macro]
  aggregation: sum
  ties: earliest_epoch
evaluation:
  accuracy: micro
  precision: macro
  recall: macro
  f1: macro
  roc_auc: macro_one_vs_rest
  pr_auc: macro_average_precision
  absent_classes: error
reproducibility:
  seeds: [32, 64, 128, 256, 512]
  cudnn_deterministic: true
  cudnn_benchmark: false
runtime:
  device: auto
  num_workers: 0
paths:
  manifest: ../../data/manifests/fma_medium_htdemucs.jsonl
  feature_dir: ../../data/features/fma_medium/musicfm_msd_layer7
  output_dir: ../../outputs/fma_medium/phase2
  summary_dir: ../../outputs/fma_medium
