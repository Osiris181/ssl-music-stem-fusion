# Paper-aligned RMS configuration for HT-Demucs late fusion.
extractor:
  name: rms
  aggregation: mean
  scaling_factor: 20.0

audio:
  sample_rate_hz: 24000
  channels: mono
  max_seconds: null

frames:
  frame_length_samples: 2048
  hop_length_samples: 512
  center: true
  padding: constant

features:
  dimension: 1
  dtype: float32
  storage: separate_from_musicfm

output:
  format: pickle
  key: zero_padded_fma_track_id
  files_per_source:
    - train
    - validation
    - test
