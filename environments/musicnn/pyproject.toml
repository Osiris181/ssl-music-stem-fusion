[project]
name = "stemfusion-musicnn-runtime"
version = "0.1.0"
description = "Isolated verified official musicnn extraction runtime (Linux CUDA)"
requires-python = ">=3.12,<3.13"
# Preserve the tested runtime, including transitive dependencies. The original
# musicnn source is installed separately with --no-deps: its obsolete NumPy
# constraint is incompatible with this verified TensorFlow runtime.
dependencies = [
    "absl-py==2.5.1",
    "astunparse==1.6.3",
    "audioread==3.1.0",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "cloudpickle==3.1.2",
    "decorator==5.3.1",
    "flatbuffers==25.12.19",
    "gast==0.7.0",
    "google-pasta==0.2.0",
    "grpcio==1.85.1",
    "h5py==3.14.0",
    "idna==3.20",
    "joblib==1.6.0",
    "keras==3.15.1",
    "lazy-loader==0.6",
    "libclang==18.1.1",
    "librosa==0.10.2.post1",
    "llvmlite==0.42.0",
    "markdown-it-py==4.3.0",
    "mdurl==0.1.2",
    "ml-dtypes==0.5.4",
    "msgpack==1.2.4",
    "namex==0.1.0",
    "narwhals==2.29.0",
    "numba==0.59.1",
    "numpy==1.26.4",
    "nvidia-cublas-cu12==12.9.3.13",
    "nvidia-cuda-cupti-cu12==12.9.79",
    "nvidia-cuda-nvcc-cu12==12.9.86",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
    "nvidia-cuda-runtime-cu12==12.9.79",
    "nvidia-cudnn-cu12==9.28.1.4",
    "nvidia-cufft-cu12==11.4.1.4",
    "nvidia-curand-cu12==10.3.10.19",
    "nvidia-cusolver-cu12==11.7.5.82",
    "nvidia-cusparse-cu12==12.5.10.65",
    "nvidia-nccl-cu12==2.32.6",
    "nvidia-nvjitlink-cu12==12.9.86",
    "opt-einsum==3.4.0",
    "optree==0.20.0",
    "packaging==26.3",
    "platformdirs==4.14.5",
    "pooch==1.9.0",
    "protobuf==7.36.2",
    "pycparser==3.12",
    "pygments==2.21.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "scikit-learn==1.9.1",
    "scipy==1.11.4",
    "setuptools==80.9.0",
    "six==1.17.0",
    "soundfile==0.13.1",
    "soxr==1.1.0",
    "tensorflow==2.21.0",
    "termcolor==3.3.0",
    "tf-keras==2.21.0",
    "threadpoolctl==3.8.0",
    "tqdm==4.67.1",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "wheel==0.48.0",
    "wrapt==2.5.2",
]

[tool.uv]
package = false
# NVIDIA runtime wheels in this preset target Linux x86_64, as tested.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
