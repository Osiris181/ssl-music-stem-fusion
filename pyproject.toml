[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-fusion-music-classification"
version = "0.1.0"
description = "Source separation and feature fusion for music classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "tqdm>=4.66,<5"]

[project.optional-dependencies]
htdemucs = ["demucs==4.0.1"]
musicfm = [
    "einops>=0.7,<1",
    "librosa>=0.10,<0.12",
    "numpy>=1.24,<3",
    "torch>=2.1,<3",
    "torchaudio>=2.1,<3",
    "transformers>=4.30,<5",
]
training = [
    "numpy>=1.24,<3",
    "torch>=2.1,<3",
    "torchmetrics>=1.2,<2",
]

[project.scripts]
stemfusion = "stemfusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/stemfusion/configs/features" = ["configs/features/*.yaml"]
"share/stemfusion/configs/training" = ["configs/training/*.yaml"]
"share/stemfusion/configs/separators" = ["configs/separators/*.yaml"]
"share/stemfusion/configs/experiments/fma_medium" = ["configs/experiments/fma_medium/*.yaml"]
